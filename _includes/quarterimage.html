{% if include.noslug %}
	{% assign slug = '' %}
{% else %}
	{% assign slug = '/' | append: page.slug %}
{% endif %}

<div class="col-md-3">
	<a href="/graphs{{slug}}/{{include.filename}}.png" target="_blank">
		<img src="/thumbs{{slug}}/{{include.filename}}.png" alt="{{include.filename}}.png"/>
	</a>
</div>
